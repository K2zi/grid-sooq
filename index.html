<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Sooq - تسوق كل ما تحتاجه</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-4 space-x-reverse">
                <a href="#" class="text-2xl font-bold text-amber-600 flex items-center">
                    <i class="fa-solid fa-store ml-2"></i> GRID SOOQ
                </a>
            </div>
            <div class="flex-1 mx-8 hidden md:flex items-center">
                <input type="text" placeholder="إبحث عن أي شيء..." class="w-full py-2 px-4 border rounded-r-lg focus:outline-none border-amber-500">
                <select class="border-y border-r py-2 px-3 bg-gray-50 text-gray-600">
                    <option>كل الأقسام</option>
                </select>
                <button class="bg-amber-600 text-white px-5 py-2 rounded-l-lg hover:bg-amber-700">
                    <i class="fa-solid fa-search"></i>
                </button>
            </div>
            <div class="flex items-center space-x-6 space-x-reverse">
                <a href="#" class="text-gray-700 hover:text-amber-600 flex items-center"><i class="fa-solid fa-user ml-1"></i> حسابي</a>
                <a href="#" class="text-gray-700 hover:text-amber-600 flex items-center"><i class="fa-solid fa-cart-shopping ml-1"></i> السلة</a>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="container mx-auto px-4 py-6">
        <div class="bg-gradient-to-l from-gray-900 to-amber-900 rounded-2xl p-8 text-white flex flex-col md:flex-row items-center justify-between">
            <div class="mb-6 md:mb-0">
                <span class="bg-amber-500 text-xs px-3 py-1 rounded-full uppercase font-bold">عروض حصرية</span>
                <h1 class="text-4xl font-bold mt-2">خصومات تصل إلى 50%</h1>
                <p class="text-gray-300 mt-2">على الإلكترونيات والمنتجات المميزة</p>
                <button class="mt-4 bg-amber-500 hover:bg-amber-600 text-white px-6 py-2 rounded-lg font-bold">تسوق الآن</button>
            </div>
        </div>
    </section>

</body>
</html>
